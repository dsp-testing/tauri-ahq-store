# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-tauri" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cromn"
      cronjob: "0 22 * * *"
  
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-setup" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cron"
      cronjob: "0 22 * * *"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-service" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cron"
      cronjob: "0 23 * * *"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-updater" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cron"
      cronjob: "0 23 * * *"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-ahqstore-types" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"

  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    target-branch: dev
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
